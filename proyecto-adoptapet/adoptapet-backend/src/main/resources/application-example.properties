spring.application.name=PROYECTO-ADOPTAPET

# ==================== DATABASE CONFIGURATION ====================
# IMPORTANTE: Configura estos valores con tus credenciales locales
# Crea una copia de este archivo llamada 'application.properties' 
# y edítalo con tus valores reales

spring.datasource.url=jdbc:mysql://localhost:3306/bd_adopcion
spring.datasource.username=root
spring.datasource.password=mysql

# ==================== JPA / HIBERNATE ====================
# 'update' para desarrollo (sincroniza @Entity con tablas)
# 'validate' para producción
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==================== FILE UPLOAD ====================
# Máximo tamaño de archivo para fotos de mascotas y PDFs
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== SECURITY & LOGGING ====================
# Debug de Spring Security (quitar en producción)
logging.level.org.springframework.security=debug

# Evita errores de serialización JSON
spring.jackson.serialization.fail-on-empty-beans=false

# ==================== PUERTO (Opcional) ====================
# server.port=8080

# ==================== CORS (Si es necesario) ====================
# cors.allowed-origins=http://localhost:4200
# cors.allowed-methods=GET,POST,PUT,DELETE
